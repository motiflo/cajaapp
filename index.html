<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CajaApp</title>
</head>
<body>
  <h1>Gestor de caja personal</h1>

  <!-- Cargar config local (no versionada) que define window.API_KEY -->
  <script src="config.js"></script>

  <!-- Tu script principal usa la API_KEY desde window.API_KEY en vez de embutirla -->
  <script>
    // Si config.js no existe o no define la clave, usamos un placeholder para evitar exponerla.
    const API_KEY = window.API_KEY || 'REPLACE_WITH_ENV_OR_SERVER';

    // Ejemplo de uso seguro: si la clave es sensible, considera usarla solo en el servidor.
    console.log('Usando API_KEY de config.js (sólo en entorno local):', API_KEY ? '****(oculto)****' : '(no configurado)');

    // Aquí iría el resto del código que utilice API_KEY, por ejemplo:
    // fetch(`https://maps.googleapis.com/maps/api/js?key=${API_KEY}`)
    //   .then(...)
  </script>
</body>
</html>
